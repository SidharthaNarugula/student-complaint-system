spring.application.name=CompSysten

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/complaint_tracker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.port=${PORT:8080}
server.address=0.0.0.0

server.servlet.session.cookie.http-only=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m